[package]
name = "gic-review-api"
version = "0.1.0"
edition = "2024"


[profile.release]
opt-level = 3 
lto = true 
strip = true
codegen-units = 1

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
aws-sdk-s3 = { version = "1.160.0", features = ["behavior-version-latest"] }
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
bytes = "1.12.2"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs"] }
moka = { version = "0.12.16", features = ["future"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-native-tls", "mysql", "macros", "migrate", "chrono"] }
thiserror = "2.0.21"
time = "0.3"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
