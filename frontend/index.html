<!doctype html>
<html lang="en" data-flavor="latte" data-accent="mauve">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Cascade layer order: must come before every stylesheet. In production Vite emits the
         split Vuetify CSS chunks (<link>s) before index.css, so without this the first layer seen
         would be `vuetify-components` and Tailwind's preflight would override Vuetify. Keep in
         sync with src/styles/main.css. -->
    <style>
      @layer theme, base, vuetify-core, vuetify-components, vuetify-overrides, components,
        vuetify-utilities, utilities, vuetify-final;
    </style>
    <title>%VITE_APP_NAME% · Study smarter for your exams</title>
    <meta
      name="description"
      content="Pick your category and subject, then study with interactive reviews, QCM quizzes and flashcards. Free, no account needed."
    />
    <meta name="theme-color" content="#eff1f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1e2e" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Google Font: self-hosted at build time by vite-plugin-webfont-dl (see vite.config.ts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

    <!-- Icons (ico + png for apps that ignore SVG favicons, e.g. chat link previews) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (Telegram, Discord, WhatsApp, Facebook, LinkedIn…): absolute URLs required,
         built from VITE_SITE_URL in frontend/.env -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%VITE_APP_NAME%" />
    <meta property="og:title" content="%VITE_APP_NAME% · Study smarter for your exams" />
    <meta
      property="og:description"
      content="Interactive reviews, QCM quizzes and flashcards. Pick your category, pick a subject, start revising. No account needed."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="GIC Review: study smarter for your exams with interactive reviews, QCM quizzes and flashcards"
    />
    <meta property="og:locale" content="en_US" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_APP_NAME% · Study smarter for your exams" />
    <meta
      name="twitter:description"
      content="Interactive reviews, QCM quizzes and flashcards. Pick your category, pick a subject, start revising."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <script>
      // Apply the saved Catppuccin flavor/accent before Vue mounts (no theme flash).
      // Keep in sync with src/stores/theme.ts.
      ;(function () {
        var flavors = ['latte', 'frappe', 'macchiato', 'mocha']
        var root = document.documentElement
        var saved = null
        var accent = null
        try {
          saved = localStorage.getItem('gic-theme-flavor')
          accent = localStorage.getItem('gic-theme-accent')
        } catch (e) {}
        var flavor = flavors.indexOf(saved) >= 0 ? saved : null
        if (!flavor) {
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          flavor = dark ? 'mocha' : 'latte'
        }
        root.setAttribute('data-flavor', flavor)
        if (accent && /^[a-z]+$/.test(accent)) root.setAttribute('data-accent', accent)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
