<!doctype html>
<html lang="en" data-flavor="latte" data-accent="mauve">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GIC Review</title>
    <script>
      // Apply the saved Catppuccin flavor/accent before Vue mounts (no theme flash).
      // Keep in sync with src/stores/theme.ts.
      ;(function () {
        var flavors = ['latte', 'frappe', 'macchiato', 'mocha']
        var root = document.documentElement
        var saved = null
        var accent = null
        try {
          saved = localStorage.getItem('gic-theme-flavor')
          accent = localStorage.getItem('gic-theme-accent')
        } catch (e) {}
        var flavor = flavors.indexOf(saved) >= 0 ? saved : null
        if (!flavor) {
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          flavor = dark ? 'mocha' : 'latte'
        }
        root.setAttribute('data-flavor', flavor)
        if (accent && /^[a-z]+$/.test(accent)) root.setAttribute('data-accent', accent)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
